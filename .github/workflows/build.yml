name: Build

on: [push, pull_request]

jobs:
  code-check:
    uses: ./.github/workflows/clippy.yml
  coverage:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/coverage.yml
  ci:
    name: CI
    if: always()
    needs: [build, code-check, coverage]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require all checks to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CODE_CHECK_RESULT: ${{ needs.code-check.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          test "$BUILD_RESULT" = success
          test "$CODE_CHECK_RESULT" = success
          test "$COVERAGE_RESULT" = success
  build:
    runs-on:  ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15-intel
          - windows-2025-vs2026
          - windows-11-arm
        rust:
          - nightly
          - beta
          - stable

    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Build
        run: |
          cargo build --no-default-features --verbose
          cargo build --all-features --verbose
          cargo build --benches --verbose
      - name: Run tests
        run: cargo test --all-features --no-fail-fast --verbose --all -- --nocapture
        env:
          RUST_BACKTRACE: 1
